name: Settings APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH="$PWD/gradle-8.2/bin:$PATH"

          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/example/shtile
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Settings"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.shtile'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.shtile"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Settings"
                  android:theme="@style/Theme.AppCompat.DayNight">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SafeTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_normal"
                      android:label="Gucci Normal"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>

                  <service
                      android:name=".BrutalTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_brutal"
                      android:label="Gucci Brutal"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/shtile/SafeTileService.kt <<'EOF'
          package com.example.shtile

          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast

          class SafeTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Gucci Normal"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE
                  qsTile?.updateTile()

                  Thread {
                      val code = runAsRoot()
                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE
                          qsTile?.updateTile()
                          toast(if (code == 0) "Normal Done" else "Normal Exit $code")
                      }
                  }.start()
              }

              private fun runAsRoot(): Int {
                  return try {
                      val cmd = "cd /data/local/tmp && (echo 7; sleep 4; echo 2; sleep 2) | /system/bin/toybox script -q -c './Hijididi' /dev/null >/dev/null 2>&1"
                      val p = ProcessBuilder("su", "-c", cmd)
                          .redirectErrorStream(true).start()
                      p.inputStream.close()
                      p.waitFor()
                  } catch (e: Exception) {
                      -1
                  }
              }

              private fun toast(msg: String) {
                  Handler(Looper.getMainLooper()).post {
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/BrutalTileService.kt <<'EOF'
          package com.example.shtile

          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast

          class BrutalTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Gucci Brutal"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE
                  qsTile?.updateTile()

                  Thread {
                      val code = runAsRoot()
                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE
                          qsTile?.updateTile()
                          toast(if (code == 0) "Brutal Done" else "Brutal Exit $code")
                      }
                  }.start()
              }

              private fun runAsRoot(): Int {
                  return try {
                      val cmd = "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal >/dev/null 2>&1"
                      val p = ProcessBuilder("su", "-c", cmd)
                          .redirectErrorStream(true).start()
                      p.inputStream.close()
                      p.waitFor()
                  } catch (e: Exception) {
                      -1
                  }
              }

              private fun toast(msg: String) {
                  Handler(Looper.getMainLooper()).post {
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/MainActivity.kt <<'EOF'
          package com.example.shtile

          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  status = findViewById(R.id.status)

                  findViewById<Button>(R.id.testSafeBtn).setOnClickListener {
                      runTestSafe()
                  }

                  findViewById<Button>(R.id.testBrutalBtn).setOnClickListener {
                      runTestBrutal()
                  }

                  status.text = "Ready to test."
              }

              private fun runTestSafe() {
                  status.text = "Running HIJI DIDI..."
                  Thread {
                      val out = try {
                          val cmd = "cd /data/local/tmp && (echo 7; sleep 4; echo 2; sleep 2) | /system/bin/toybox script -q -c './Hijididi' /dev/null"
                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true).start()
                          val text = p.inputStream.bufferedReader().readText()
                          val code = p.waitFor()
                          "$text\nexit=$code"
                      } catch (e: Exception) {
                          "Error: ${e.message}"
                      }
                      runOnUiThread { status.text = "HIJI DIDI Result:\n\n$out" }
                  }.start()
              }

              private fun runTestBrutal() {
                  status.text = "Running Brutal on Gucci_brutal..."
                  Thread {
                      val out = try {
                          val cmd = "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal"
                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true).start()
                          val text = p.inputStream.bufferedReader().readText()
                          val code = p.waitFor()
                          "$text\nexit=$code"
                      } catch (e: Exception) {
                          "Error: ${e.message}"
                      }
                      runOnUiThread { status.text = "Brutal Result:\n\n$out" }
                  }.start()
              }

              override fun onDestroy() {
                  status.text = ""
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical"
              android:padding="24dp"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <Button android:id="@+id/testSafeBtn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="HIJI DIDI"/>

              <Button android:id="@+id/testBrutalBtn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Test Brutal (Gucci_brutal)"/>

              <TextView android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingTop="16dp"
                  android:typeface="monospace"
                  android:textSize="12sp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/drawable/ic_tile_normal.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2L4,5v6c0,5.55 3.84,10.74 8,12 4.16,-1.26 8,-6.45 8,-12V5l-8,-3zM10.94,15.54l-3.4,-3.4 1.41,-1.41 1.99,1.99 4.24,-4.24 1.41,1.41 -5.65,5.65z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_tile_brutal.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Settings</string></resources>
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Settings-debug
          path: app/build/outputs/apk/debug/app-debug.apk
